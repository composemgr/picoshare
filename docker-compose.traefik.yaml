name: picoshare
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  picoshare:
    image: mtlynch/picoshare:latest
    pull_policy: always
    container_name: picoshare-app
    restart: always
    logging: *default-logging
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.picoshare.entrypoints=http'
      - 'traefik.http.routers.picoshare.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.picoshare.middlewares=picoshare-https-redirect'
      - 'traefik.http.middlewares.picoshare-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.picoshare-secure.entrypoints=https'
      - 'traefik.http.routers.picoshare-secure.tls=true'
      - 'traefik.http.routers.picoshare-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.picoshare-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.picoshare-secure.service=picoshare'
      - 'traefik.http.services.picoshare.loadbalancer.server.port=8080'
    networks:
      - picoshare
      - traefik
    environment:
      TZ: ${TZ:-America/New_York}
      PORT: 8080
      PS_SHARED_SECRET: ${APP_SECRET_KEY:-changeme_secret_key}
      CONTAINER_NAME: picoshare-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/config/picoshare:/config
      - ./volumes/data/picoshare:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  picoshare:
    name: picoshare
    external: false
  traefik:
    external: true
