# nginx proxy address - http://172.17.0.1:64300

name: picoshare
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  picoshare:
    image: mtlynch/picoshare:latest
    pull_policy: always
    container_name: picoshare-app
    restart: always
    logging: *default-logging
    ports:
      - '172.17.0.1:64300:8080'
    networks:
      - picoshare
    environment:
      TZ: ${TZ:-America/New_York}
      PORT: 8080
      PS_SHARED_SECRET: ${APP_SECRET_KEY:-changeme_secret_key}
      CONTAINER_NAME: picoshare-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/config/picoshare:/config
      - ./volumes/data/picoshare:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  picoshare:
    name: picoshare
    external: false
